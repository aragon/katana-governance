[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = '0.8.24'
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
bytecode_hash = "none"
cbor_metadata = false
verbosity = 5

fs_permissions = [
    { access = "read", path = "./multisig-members.json" },
    { access = "write", path = "./artifacts" }
]

[profile.default.invariant]
fail_on_revert = true
runs = 256
depth = 64

[fmt]
single_line_statement_blocks = "preserve"
line_length = 120
int_types = "long"
bracket_spacing = true
multiline_func_header = "all"
quote_style = "double"
tab_width = 4
wrap_comments = true

