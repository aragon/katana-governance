[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = '0.8.17'
evm_version = "shanghai"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
verbosity=5

fs_permissions = [
    { access = "read", path = "./multisig-members.json" },
    { access = "write", path = "./artifacts" },
]

[fmt]
single_line_statement_blocks = "multi"
line_length = 120
int_types = "long"
bracket_spacing = true
multiline_func_header = "all"
quote_style = "double"
tab_width = 4
wrap_comments = true

