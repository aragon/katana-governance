[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = '0.8.17'
evm_version = "shanghai"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
verbosity=5

fs_permissions = [
    { access = "read", path = "./multisig-members.json" },
    { access = "read", path = "./lib/protocol-factory/out/ProtocolFactoryBuilder.sol/ProtocolFactoryBuilder.json" },
    { access = "write", path = "./artifacts" },
]


